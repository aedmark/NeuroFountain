<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLASH Frictionless Screenwriter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Open Source Theme Variables - Easy to adapt */
            --bg-void: #0f1115;
            --text-void: #a1a1aa;
            --text-void-muted: #64748b;
            --bg-paper: #ffffff;
            --text-ink: #000000;
            --border-void: #1e293b;
            --border-paper: #e5e7eb;
            --btn-bg: #1e293b;
            --btn-text: #e2e8f0;
            --btn-hover: #334155;
            --btn-success: #15803d;

            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-screenplay: 'Courier Prime', Courier, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-void);
            font-family: var(--font-ui);
            color: var(--text-void);
            overflow: hidden;
        }

        /* Desktop Layout */
        @media (min-width: 768px) {
            body {
                flex-direction: row;
            }
        }

        /* --- THE VOID (Input) --- */
        .pane-void {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 50vh;
            border-bottom: 1px solid var(--border-void);
            background-color: var(--bg-void);
        }

        @media (min-width: 768px) {
            .pane-void {
                height: 100vh;
                border-bottom: none;
                border-right: 1px solid var(--border-void);
            }
        }

        .header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-void);
        }

        .header h1, .header h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .header h1 { color: #f8fafc; }

        .header p {
            margin: 0.25rem 0 0 0;
            font-size: 0.75rem;
            color: var(--text-void-muted);
        }

        .btn {
            padding: 0.5rem 1rem;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-family: inherit;
        }

        .btn:hover { background-color: var(--btn-hover); }
        .btn.success { background-color: var(--btn-success); color: white; }

        textarea {
            flex: 1;
            width: 100%;
            padding: 1.5rem;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            color: var(--text-void);
            font-family: monospace;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        /* --- THE CANVAS (Output) --- */
        .pane-canvas {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 50vh;
            background-color: var(--bg-paper);
            position: relative;
        }

        @media (min-width: 768px) {
            .pane-canvas { height: 100vh; }
        }

        .pane-canvas .header {
            background-color: white;
            border-bottom: 1px solid var(--border-paper);
            z-index: 20;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .pane-canvas .header h2 { color: var(--text-ink); }

        .font-badge {
            font-family: monospace;
            font-size: 0.75rem;
            background: #f3f4f6;
            color: #6b7280;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border: 1px solid #e5e7eb;
        }

        #render-target {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            color: var(--text-ink);
            background-color: var(--bg-paper);
        }

        @media (min-width: 768px) {
            #render-target { padding: 4rem; }
        }

        /* Screenplay Formatting (CSS Implementation of Fountain Rules) */
        .screenplay-font {
            font-family: var(--font-screenplay);
            font-size: 12pt;
            line-height: 1.1;
            max-width: 800px;
            margin: 0 auto;
        }

        .script-scene-heading { text-transform: uppercase; font-weight: 700; margin-top: 1.5rem; margin-bottom: 1rem; }
        .script-action { margin-bottom: 1rem; width: 100%; }
        .script-character { text-transform: uppercase; margin-left: 35%; margin-top: 1rem; margin-bottom: 0; }
        .script-parenthetical { margin-left: 28%; width: 44%; margin-bottom: 0; }
        .script-dialogue { margin-left: 20%; width: 60%; margin-bottom: 1rem; }
        .script-transition { text-transform: uppercase; text-align: right; margin-bottom: 1rem; width: 95%; }
        .script-spacer { height: 1rem; }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        .pane-canvas ::-webkit-scrollbar-thumb { background: #cbd5e1; }
        .pane-canvas ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

<!-- The Void (Input) -->
<div class="pane-void">
    <div class="header">
        <div>
            <h1>The Void</h1>
            <p>Just type. We handle the structure.</p>
        </div>
        <button id="copyBtn" class="btn">Copy Raw Text</button>
    </div>
    <textarea id="editor" placeholder="FADE IN:&#10;&#10;INT. COFFEE SHOP - DAY&#10;&#10;The cafe is entirely empty.&#10;&#10;JOHN&#10;(nervous)&#10;I just wanted a program that let me type without thinking.&#10;&#10;THE ARTISAN&#10;It is done.&#10;&#10;CUT TO:&#10;&#10;EXT. THE VOID - CONTINUOUS"></textarea>
</div>

<!-- The Canvas (Output) -->
<div class="pane-canvas">
    <div class="header">
        <div>
            <h2>The Canvas</h2>
            <p>Live structural rendering.</p>
        </div>
        <span class="font-badge">Courier Prime</span>
    </div>
    <div id="render-target" class="screenplay-font">
        <!-- Rendered script appears here -->
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const renderTarget = document.getElementById('render-target');
    const copyBtn = document.getElementById('copyBtn');

    // The Linguist's Parsing Engine
    function parseScript(text) {
        const lines = text.split('\n');
        let htmlOutput = '';
        let isDialogueBlock = false;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();

            // Empty lines reset the dialogue state and add a blank space
            if (line === '') {
                htmlOutput += '<div class="script-spacer"></div>';
                isDialogueBlock = false;
                continue;
            }

            // Scene Headings: Starts with INT., EXT., INT/EXT.
            if (/^(INT\.|EXT\.|INT\/EXT\.|EST\.)/i.test(line)) {
                htmlOutput += `<div class="script-scene-heading">${escapeHTML(line)}</div>`;
                isDialogueBlock = false;
            }
            // Opening Fade (Flush Left)
            else if (/^FADE IN[:\.]?$/i.test(line)) {
                htmlOutput += `<div class="script-action" style="text-transform: uppercase;">${escapeHTML(line)}</div>`;
                isDialogueBlock = false;
            }
            // Transitions: Explicit (>), strict endings, or known cinematic transitions
            else if (line.startsWith('>') ||
                /^[A-Z\s]+(TO[:\.]|OUT[:\.]|CUT[:\.]|BLACK[:\.]|WHITE[:\.])$/.test(line) ||
                /^(FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT)/.test(line)) {
                let text = line.startsWith('>') ? line.substring(1).trim() : line;
                htmlOutput += `<div class="script-transition">${escapeHTML(text)}</div>`;
                isDialogueBlock = false;
            }
            // Characters: All uppercase, not a scene heading or transition keyword, followed by a non-empty line
            else if (/^[A-Z0-9\s\(\)\.\-]+$/.test(line) &&
                /[A-Z]/.test(line) && // Must contain at least one letter
                !/^(INT\.|EXT\.|EST\.|FADE\b|CUT\b|SMASH\b|MATCH\b|DISSOLVE\b)/i.test(line) &&
                i + 1 < lines.length && lines[i+1].trim() !== '') {

                htmlOutput += `<div class="script-character">${escapeHTML(line)}</div>`;
                isDialogueBlock = true;
            }
            // Parenthetical: Must be inside a dialogue block, starts with (, ends with )
            else if (isDialogueBlock && line.startsWith('(') && line.endsWith(')')) {
                htmlOutput += `<div class="script-parenthetical">${escapeHTML(line)}</div>`;
            }
            // Dialogue: Anything immediately following a Character or Parenthetical
            else if (isDialogueBlock) {
                htmlOutput += `<div class="script-dialogue">${escapeHTML(line)}</div>`;
            }
            // Action: Everything else
            else {
                htmlOutput += `<div class="script-action">${escapeHTML(line)}</div>`;
                isDialogueBlock = false; // Breaking the block just in case
            }
        }

        return htmlOutput;
    }

    // Utility: Prevent XSS and format text safely
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    // Event Listeners
    editor.addEventListener('input', () => {
        const rawText = editor.value;
        renderTarget.innerHTML = parseScript(rawText);
    });

    // Initialize with placeholder text on load
    window.addEventListener('DOMContentLoaded', () => {
        // Check if placeholder is active, if so render it, otherwise render empty
        if(editor.value) {
            renderTarget.innerHTML = parseScript(editor.value);
        }
    });

    // Copy functionality
    copyBtn.addEventListener('click', () => {
        editor.select();
        document.execCommand('copy');

        // Brief UI feedback
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "Copied!";
        copyBtn.classList.add('success');

        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.classList.remove('success');
        }, 2000);
    });

    // Sync scrolling (Optional but helpful for large documents)
    editor.addEventListener('scroll', () => {
        const scrollPercentage = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);
        renderTarget.scrollTop = scrollPercentage * (renderTarget.scrollHeight - renderTarget.clientHeight);
    });
</script>
</body>
</html>
